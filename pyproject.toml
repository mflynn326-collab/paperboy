[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperboy-local"
version = "0.1.0"
description = "Local-first finance literature pipeline and query tool"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5",
]

[project.scripts]
paperboy = "paperboy.cli:main"

[tool.setuptools]
packages = ["paperboy"]
